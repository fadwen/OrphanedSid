# Quality gates for OrphanedSid.
#
# Four jobs, because the module makes claims that can only fail in different places:
#
#   tests     Windows, PowerShell 7. PSScriptAnalyzer over the shipping code with zero tolerance,
#             over the tests with a relaxed rule set, and over everything with its ScriptSecurity
#             preset, then the whole Pester suite shuffled with a 93% coverage gate over Public/
#             and Private/. Every Active Directory cmdlet the suite touches is mocked;
#             Tests/TestHelpers/ADCmdletStubs.ps1 defines placeholders when RSAT is absent, so the
#             suite reaches no directory.
#
#   desktop   Windows PowerShell 5.1. The manifest declares CompatiblePSEditions Desktop and the
#             root module carries #Requires -Version 5.1, because the RSAT ActiveDirectory module
#             is what most domain-joined management hosts have, and nothing else. A ternary, a
#             null-coalescing operator or a ForEach-Object -Parallel parses cleanly under 7 and
#             breaks every command under 5.1, and nothing but a 5.1 host notices.
#
#   help      Ubuntu. The command help gate: the PlatyPS Markdown under docs/ is valid and
#             complete, the committed MAML in en-US/ was built from it, and Get-Help serves every
#             command's full help on a case-sensitive filesystem - the only place the -Help.xml
#             capital H can fail.
#
#   rehearsal Windows. The release script with -WhatIf: it stages the package from its allowlist,
#             imports the staged copy in a new process, measures the manifest against the limits
#             of the Gallery, and stops before the upload. A change that breaks staging is found
#             on its pull request and not when the release is made.
#
# There is no Linux test job. The module reads and writes
# System.DirectoryServices.ActiveDirectorySecurity, which is Windows-only in .NET, and the unit
# tests construct those types directly. Importing the module on Linux works (the help job does
# it); running it does not.

name: 'Quality Gates'

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

  # Every night, on the default branch. A runner image or the Gallery can change under a
  # repository that nobody pushes to, and this is how that shows before the next pull request.
  schedule:
    - cron: '17 3 * * *'

  # Callable so release.yml can run these exact gates before publishing.
  workflow_call:

permissions:
  contents: read

# The build tools, each at one fixed version for every job. An install without a version can
# change what a passing build means, and two jobs with different versions can disagree. Change a
# number here, run the suite, and commit both in one change. release.yml installs PlatyPS at
# the same version; keep the two in step.
env:
  PESTER_VERSION: '6.2.0'
  PSSCRIPTANALYZER_VERSION: '1.25.0'
  PLATYPS_VERSION: '1.0.3'

jobs:
  tests:
    name: 'Tests and analysis'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Runners ship Pester 5.x. Pester 6 must be installed explicitly.
          Install-PSResource -Name Pester -Version $env:PESTER_VERSION -Scope CurrentUser -TrustRepository
          $analyzer = @{
              Name = 'PSScriptAnalyzer'
              Version = $env:PSSCRIPTANALYZER_VERSION
              Scope = 'CurrentUser'
              TrustRepository = $true
          }
          Install-PSResource @analyzer
          $PSVersionTable | ConvertTo-Json -Depth 3

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION
          # Shipping code: every Error and Warning rule. Tests and Tools: the relaxed settings in
          # Tests/PSScriptAnalyzerSettings.psd1, which drop the rules that fire on every mock and
          # stub (unused parameters, global stubs, assignments the test only reads indirectly).
          $strict = foreach ($path in 'Classes', 'Private', 'Public', 'Build', 'OrphanedSid.psm1', 'OrphanedSid.psd1') {
              Invoke-ScriptAnalyzer -Path $path -Recurse -Severity Error, Warning
          }
          $relaxed = foreach ($path in 'Tests', 'Tools') {
              Invoke-ScriptAnalyzer -Path $path -Recurse -Settings ./Tests/PSScriptAnalyzerSettings.psd1
          }
          $issues = @($strict) + @($relaxed)
          if ($issues) {
              $issues | Format-Table RuleName, Severity, ScriptName, Line -AutoSize | Out-String | Write-Host
              throw "PSScriptAnalyzer reported $($issues.Count) issue(s)."
          }
          Write-Host 'PSScriptAnalyzer clean.'

      # The preset of PSScriptAnalyzer for security: commands built from text, passwords in plain
      # text, and the like. It runs over every folder, the tests and the lab tool included, and
      # the relaxed settings of the step above do not apply to it.
      - name: Security scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module PSScriptAnalyzer -RequiredVersion $env:PSSCRIPTANALYZER_VERSION
          $paths = 'Classes', 'Private', 'Public', 'Build', 'Tools', 'Tests', 'OrphanedSid.psm1', 'OrphanedSid.psd1'
          $findings = foreach ($path in $paths) {
              Invoke-ScriptAnalyzer -Path $path -Recurse -Settings ScriptSecurity
          }
          $findings = @($findings)
          if ($findings.Count -gt 0) {
              $findings | Format-Table RuleName, Severity, ScriptName, Line -AutoSize | Out-String | Write-Host
              throw "The security scan reported $($findings.Count) finding(s)."
          }
          Write-Host 'Security scan clean.'

      - name: Pester with coverage
        shell: pwsh
        run: |
          # The pwsh and powershell shells on GitHub Actions prepend $ErrorActionPreference = 'stop' to
          # every step. The tests inherit it, and a function under test that reports a per-item
          # problem with Write-Error then terminates instead of continuing, which fails tests that
          # pass everywhere else. Set it back before the suite runs; the gates below throw explicitly.
          $ErrorActionPreference = 'Continue'
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION -ErrorAction Stop
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './Tests'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Detailed'
          # Shuffled, so a test that only passes because of what ran before it fails here rather
          # than on somebody's machine. The seed is printed so a failing order can be replayed
          # locally with $cfg.Run.ShuffleSeed.
          $seed = Get-Random -Minimum 1 -Maximum 2147483647
          $cfg.Run.Shuffle = $true
          $cfg.Run.ShuffleSeed = $seed
          Write-Host "Pester shuffle seed: $seed"

          $cfg.CodeCoverage.Enabled = $true
          $cfg.CodeCoverage.Path = './Public/*.ps1', './Private/*/*.ps1'
          # CoveragePercentTarget only reports; the gate below is what enforces it.
          $cfg.CodeCoverage.CoveragePercentTarget = 80

          $result = Invoke-Pester -Configuration $cfg

          # The result as a whole is what counts. A BeforeAll or AfterAll that fails leaves the
          # count of failed tests and of failed files at 0 with the result Failed, and a run that
          # finds no test file returns nothing at all.
          if ($null -eq $result -or $result.TotalCount -eq 0) {
              throw 'Pester ran no tests.'
          }
          if ($result.Result -ne 'Passed') {
              throw ("Pester result is '$($result.Result)': $($result.FailedCount) test(s), " +
                  "$($result.FailedBlocksCount) block(s) and $($result.FailedContainersCount) " +
                  "file(s) failed under shuffle seed $seed.")
          }

          # 80% is the standards' floor. The suite measures about 94.8% since every test was
          # rewritten to exercise the real functions; the gate sits below that by a margin, so
          # that a change does not fail for a few commands it leaves uncovered. Raise the number
          # as coverage rises; never lower it.
          $coverageGate = 93
          $coverage = [math]::Round($result.CodeCoverage.CoveragePercent, 2)
          Write-Host "Code coverage: $coverage% (gate $coverageGate%)"
          if ($coverage -lt $coverageGate) {
              throw "Code coverage $coverage% is below the $coverageGate% gate."
          }

  desktop:
    name: 'Windows PowerShell 5.1'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 'powershell' here is Windows PowerShell 5.1, not pwsh. Import, count the exports against
      # the manifest, and confirm every command serves its compiled help: each export carries
      # .EXTERNALHELP, so a description proves 5.1 read en-US/OrphanedSid-Help.xml.
      - name: Import and verify exports
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          "PowerShell $($PSVersionTable.PSVersion) ($($PSVersionTable.PSEdition))" | Write-Host

          Import-Module ./OrphanedSid.psd1 -Force
          $declared = @((Import-PowerShellDataFile ./OrphanedSid.psd1).FunctionsToExport) | Sort-Object
          $actual = @((Get-Module OrphanedSid).ExportedFunctions.Keys) | Sort-Object

          if (($declared -join ',') -ne ($actual -join ',')) {
              throw "Exports differ from the manifest. Declared: $($declared.Count); actual: $($actual.Count)."
          }

          $noHelp = @(foreach ($name in $actual) {
              if (-not (Get-Help $name -ErrorAction SilentlyContinue).Description) { $name }
          })
          if ($noHelp) { throw "Commands serving no help under 5.1: $($noHelp -join ', ')" }
          Write-Host "All $($actual.Count) commands exported with help under Windows PowerShell 5.1."

      # Pester 6 declares PowerShellVersion 5.1 and runs the suite unchanged.
      - name: Install Pester
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # -SkipPublisherCheck, because Windows ships Pester 3.4.0 under another publisher
          $pester = @{
              Name = 'Pester'
              RequiredVersion = $env:PESTER_VERSION
              Scope = 'CurrentUser'
              Force = $true
              SkipPublisherCheck = $true
              AllowClobber = $true
          }
          Install-Module @pester
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION
          "Pester $((Get-Module Pester).Version) on PowerShell $($PSVersionTable.PSVersion)" | Write-Host

      - name: Pester under Windows PowerShell 5.1
        shell: powershell
        run: |
          # Same as the PowerShell 7 job: the shell's Stop preference must not reach the tests
          $ErrorActionPreference = 'Continue'
          Import-Module Pester -RequiredVersion $env:PESTER_VERSION -ErrorAction Stop
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './Tests'
          $cfg.Run.PassThru = $true
          $cfg.Output.Verbosity = 'Detailed'
          $seed = Get-Random -Minimum 1 -Maximum 2147483647
          $cfg.Run.Shuffle = $true
          $cfg.Run.ShuffleSeed = $seed
          Write-Host "Pester shuffle seed: $seed"
          $result = Invoke-Pester -Configuration $cfg
          # The same two checks as the PowerShell 7 job. This job has no coverage gate behind
          # them, so a run with no tests would otherwise pass.
          if ($null -eq $result -or $result.TotalCount -eq 0) {
              throw 'Pester ran no tests under Windows PowerShell 5.1.'
          }
          if ($result.Result -ne 'Passed') {
              throw ("Pester result is '$($result.Result)' under Windows PowerShell 5.1: " +
                  "$($result.FailedCount) test(s), $($result.FailedBlocksCount) block(s) and " +
                  "$($result.FailedContainersCount) file(s) failed, shuffle seed $seed.")
          }

  help:
    name: 'Command help'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned exactly. The staleness check compares a rebuilt MAML against the committed one
      # byte for byte, so a PlatyPS release that changes the emitted XML would fail the build for a
      # reason nobody changed. Bump deliberately, rebuild, commit the result in the same change.
      - name: Install PlatyPS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $platyPS = @{
              Name = 'Microsoft.PowerShell.PlatyPS'
              Version = $env:PLATYPS_VERSION
              Scope = 'CurrentUser'
              TrustRepository = $true
          }
          Install-PSResource @platyPS
          $PSVersionTable | ConvertTo-Json -Depth 3

      - name: Validate help Markdown
        shell: pwsh
        run: ./Build/Build-Help.ps1 -ValidateOnly

      - name: Fail on stale committed MAML
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $committed = './en-US/OrphanedSid-Help.xml'
          if (-not (Test-Path $committed)) { throw "No committed help at $committed." }
          $before = (Get-FileHash $committed -Algorithm SHA256).Hash

          ./Build/Build-Help.ps1 | Out-Null

          $after = (Get-FileHash $committed -Algorithm SHA256).Hash
          if ($before -ne $after) {
              throw 'en-US/OrphanedSid-Help.xml is out of date. Run ./Build/Build-Help.ps1 and commit the result.'
          }
          Write-Host 'Committed MAML matches the Markdown.'

      # Get-Help resolves .EXTERNALHELP against the culture folder by exact filename, so a casing
      # mismatch fails here and only here.
      - name: Verify Get-Help on a case-sensitive filesystem
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module ./OrphanedSid.psd1 -Force

          $failed = @()
          foreach ($command in (Get-Module OrphanedSid).ExportedFunctions.Keys | Sort-Object) {
              $help = Get-Help $command -Full
              if (-not $help.Description) { $failed += "$command : no description" ; continue }
              if (@($help.Examples.Example).Count -lt 3) { $failed += "$command : fewer than 3 examples" ; continue }
              if (-not $help.parameters.parameter) { $failed += "$command : no parameter help" ; continue }

              Write-Host ("{0,-28} {1} examples, {2} parameters" -f
                  $command, @($help.Examples.Example).Count, @($help.parameters.parameter).Count)
          }

          if (-not (Get-Help about_OrphanedSid -ErrorAction SilentlyContinue)) {
              $failed += 'about_OrphanedSid : topic not found'
          }

          if ($failed) {
              $failed | ForEach-Object { Write-Host "FAILED: $_" }
              throw 'MAML help was not served on a case-sensitive filesystem.'
          }
          Write-Host 'All commands served full help from MAML.'

  rehearsal:
    name: 'Release rehearsal'
    # Windows, like the publish job of release.yml: the release script imports the staged copy
    # and runs Test-SIDFormat, which builds a SecurityIdentifier.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The release script builds the help, so it needs PlatyPS at the version the help job uses
      - name: Install PlatyPS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $platyPS = @{
              Name = 'Microsoft.PowerShell.PlatyPS'
              Version = $env:PLATYPS_VERSION
              Scope = 'CurrentUser'
              TrustRepository = $true
          }
          Install-PSResource @platyPS

      # -WhatIf stops the script before the upload and needs no API key
      - name: Stage and verify the package (no publish)
        shell: pwsh
        run: ./Build/Publish-Module.ps1 -WhatIf
